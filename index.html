<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Estudio DJ</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a14;color:#fff;font-family:sans-serif;padding:12px}.h{text-align:center;padding:16px}.h h1{font-size:26px;background:linear-gradient(90deg,#00f2ff,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.card{background:#181828;border-radius:18px;padding:14px;margin:12px auto;max-width:500px}.btn{width:100%;padding:12px;border:0;border-radius:12px;background:#00e5ff;font-weight:900;margin:6px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pad{aspect-ratio:1;background:#262640;border-radius:12px;display:flex;align-items:center;justify-content:center}</style></head><body><div class="h"><h1>🎧 MI ESTUDIO DJ</h1><p>Jeremías - Bermejo</p></div><div class="card"><h2>🎤 Mi voz</h2><button class="btn" id="r">🎙️ Grabar</button><audio id="a" controls style="display:none;width:100%"></audio></div><div class="card"><h2>🎹 Pads</h2><div class="grid"><div class="pad" onclick="s('kick')">KICK</div><div class="pad" onclick="s('snare')">SNARE</div><div class="pad" onclick="s('hihat')">HIHAT</div><div class="pad" onclick="s('clap')">CLAP</div></div></div><script>let x;const C=()=>x||(x=new AudioContext());function s(t){let c=C(),n=c.currentTime;if(t=='kick'){let o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(150,n);o.frequency.exponentialRampToValueAtTime(0.01,n+0.5);g.gain.setValueAtTime(1,n);g.gain.exponentialRampToValueAtTime(0.01,n+0.5);o.connect(g).connect(c.destination);o.start();o.stop(n+0.5)}else{let b=c.createBuffer(1,c.sampleRate*0.2,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;let u=c.createBufferSource();u.buffer=b;let g=c.createGain();g.gain.setValueAtTime(1,n);g.gain.exponentialRampToValueAtTime(0.01,n+0.2);u.connect(g).connect(c.destination);u.start()}}let m,d=[],r=document.getElementById('r'),a=document.getElementById('a');r.onclick=async()=>{if(m&&m.state=='recording'){m.stop();return}let st=await navigator.mediaDevices.getUserMedia({audio:true});m=new MediaRecorder(st);d=[];m.ondataavailable=e=>d.push(e.data);m.onstart=()=>r.textContent='⏹️ Parar';m.onstop=()=>{let b=new Blob(d);a.src=URL.createObjectURL(b);a.style.display='block';r.textContent='🎙️ Grabar de nuevo';st.getTracks().forEach(t=>t.stop())};m.start()}</script></body></html>
