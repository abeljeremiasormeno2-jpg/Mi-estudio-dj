
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Mi Estudio DJ</title>
        <style>
            body {
                  margin: 0;
                        padding: 25px;
                              background: #101020;
                                    color: white;
                                          font-family: Arial, sans-serif;
                                                text-align: center;
                                                    }
                                                        h1 { color: #00e5ff; }
                                                            .panel {
                                                                  background: #22223a;
                                                                        padding: 20px;
                                                                              margin: 15px 0;

                                                                                        }

                                                                                                  width: 100%;

                                                                                                                                background: #00e5ff;
                                                                                                                                      color: #101020;
                                                                                                                                            font-size: 16px;
                                                                                                                                                  font-weight: bold;
                                                                                                                                                      }
                                                                                                                                                          p { color: #dddded; }
                                                                                                                                                            </style>
                                                                                                                                                            </head>
                                                                                                                                                            <body>
                                                                                                                                                              <h1>🎧 Mi Estudio DJ</h1>
                                                                                                                                                                <p>¡Tu música, tu voz, tu estilo!</p>

                                                                                                                                                                  <div class="panel">
                                                                                                                                                                      <h2>🎤 Mi voz</h2>
                                                                                                                                                                          <p>Graba tu voz para tus canciones.</p>
                                                                                                                                                                              <button onclick="alert('Próximo paso: activar la grabación')">

                                                                                                                                                                                        </button>
                                                                                                                                                                                          </div>

                                                                                                                                                                                            <div class="panel">
                                                                                                                                                                                                <h2>🎹 Crear música</h2>
                                                                                                                                                                                                    <button onclick="alert('Próximo paso: crea imr ritmos')">
                                                                                                                                                                                                          🥁 Crear ritmos
                                                                                                                                                                                                              </button>
                                                                                                                                                                                                                  <button onclick="alert('Próximo paso: integrar IA musical')">
                                                                                                                                                                                                                        ✨ Crear canción con IA
                                                                                                                                                                                                                            </button>
                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                <div class="panel">
                                                                                                                                                                                                                                    <h2>💿 Mis canciones</h2>
                                                                                                                                                                                                                                        <button onclick="alert('Próximo paso: exportar MP3')">
                                                                                                                                                                                                                                              📥 Exportar MP3
                                                                                                                                                                                                                                                  </button>
                                                                                                                                                                                                                                                      <button onclick="alert('Próximo paso: compartir música')">
                                                                                                                                                                                                                                                            📲 Compartir
                                                                                                                                                                                                                                                                </button>
                                                                                                                                                                                                                                                                  </div>
