<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Estudio DJ - Jeremias</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a14;color:#fff;font-family:sans-serif;padding:10px}.h{text-align:center;padding:18px}.h h1{font-size:28px;background:linear-gradient(90deg,#00f2ff,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}.card{background:#181828;border-radius:18px;padding:15px;margin:12px auto;max-width:500px;border:1px solid #222}.btn{width:100%;padding:13px;border:0;border-radius:12px;background:#00e5ff;color:#000;font-weight:900;margin:7px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.pad{aspect-ratio:1;background:#262640;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700}</style></head><body><div class="h"><h1>🎧 MI ESTUDIO DJ</h1><p>Jeremias - Bermejo, Mendoza</p></div><div class="card"><h2>🎤 Mi Voz</h2><button class="btn" id="bR">🎙️ Grabar mi voz</button><audio id="au" controls style="display:none;width:100%;margin-top:8px"></audio></div><div class="card"><h2>🎹 Pads</h2><div class="grid"><div class="pad" onclick="s('kick')">KICK</div><div class="pad" onclick="s('snare')">SNARE</div><div class="pad" onclick="s('hihat')">HIHAT</div><div class="pad" onclick="s('clap')">CLAP</div></div></div><div class="card"><h2>✨ IA</h2><button class="btn" onclick="ia()">✨ Crear melodía IA</button></div><script>let A;const C=()=>A||(A=new(window.AudioContext||window.webkitAudioContext)());function s(t){let c=C(),n=c.currentTime;if(t=='kick'){let o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(160,n);o.frequency.exponentialRampToValueAtTime(0.01,n+0.5);g.gain.setValueAtTime(1,n);g.gain.exponentialRampToValueAtTime(0.01,n+0.5);o.connect(g).connect(c.destination);o.start();o.stop(n+0.5)}else{let b=c.createBuffer(1,c.sampleRate*0.2,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;let u=c.createBufferSource();u.buffer=b;let g=c.createGain();g.gain.setValueAtTime(1,n);g.gain.exponentialRampToValueAtTime(0.01,n+0.2);u.connect(g).connect(c.destination);u.start()}}function ia(){let c=C();[261,329,392,523].forEach((f,i)=>setTimeout(()=>{let o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(0.4,c.currentTime);g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+0.5);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+0.5)},i*200))}let M,D=[],bR=document.getElementById('bR'),au=document.getElementById('au');bR.onclick=async()=>{if(M&&M.state=='recording'){M.stop();return}let st=await navigator.mediaDevices.getUserMedia({audio:true});M=new MediaRecorder(st);D=[];M.ondataavailable=e=>D.push(e.data);M.onstart=()=>bR.textContent='⏹️ Parar';M.onstop=()=>{let bl=new Blob(D);au.src=URL.createObjectURL(bl);au.style.display='block';bR.textContent='🎙️ Grabar de nuevo';st.getTracks().forEach(t=>t.stop())};M.start()};</script></body></html>
